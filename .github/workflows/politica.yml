name: Política Factory v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  factory-policy:
    name: Factory policy
    uses: pl0n3r/factory/.github/workflows/politica.yml@74bc1c841567d3431571dab19c42a22c4a76526d
    with:
      factory_ref: 74bc1c841567d3431571dab19c42a22c4a76526d
      pr_number: ${{ github.event.pull_request.number }}
      required_review_bot: coderabbitai[bot]
