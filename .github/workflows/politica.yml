name: Política Factory v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  factory-policy:
    name: Factory policy
    uses: pl0n3r/factory/.github/workflows/politica.yml@9c12107bd64ef4bbc45b3baf4f961a6ce6f14664
    with:
      factory_ref: 9c12107bd64ef4bbc45b3baf4f961a6ce6f14664
      pr_number: ${{ github.event.pull_request.number }}
      required_review_bot: coderabbitai[bot]