name: Política Factory v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  factory-policy:
    name: Factory policy
    uses: pl0n3r/factory/.github/workflows/politica.yml@4c26baad32f307adfb6c29e00eee989a935aa966
    with:
      factory_ref: 4c26baad32f307adfb6c29e00eee989a935aa966
      pr_number: ${{ github.event.pull_request.number }}
      required_review_bot: coderabbitai[bot]