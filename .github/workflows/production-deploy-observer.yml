name: GrindFlow Deploy Observer
run-name: "GrindFlow Deploy Observer #${{ github.run_number }} · ${{ github.ref_name }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grindflow-deploy-observer
  cancel-in-progress: true

jobs:
  observe:
    name: release-deploy-marker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: https://www.grindflow.com.co
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Read expected human release
        shell: bash
        run: |
          set -euo pipefail
          version="$(php -r '$v = require "config/version.php"; echo $v["number"];')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "EXPECTED_VERSION=$version" >> "$GITHUB_ENV"

      - name: Observe exact production identity without writes
        shell: bash
        run: |
          set -euo pipefail
          observed=false
          for attempt in $(seq 1 30); do
            payload="$(curl -fsS --connect-timeout 3 --max-time 8 \
              -H 'Cache-Control: no-cache' \
              "${PRODUCTION_URL}/health?probe=${GITHUB_RUN_ID}-${attempt}" || true)"
            if jq -e \
              --arg version "$EXPECTED_VERSION" \
              --arg sha "$EXPECTED_SOURCE_SHA" \
              'type == "object"
                and .status == "ok"
                and .version == $version
                and .exact == true
                and .commit == $sha' \
              <<< "$payload" >/dev/null 2>&1; then
              observed=true
              break
            fi
            if [[ "$attempt" -lt 30 ]]; then sleep 8; fi
          done

          {
            echo '## GrindFlow production release observation'
            echo
            echo "- Expected release: `v$EXPECTED_VERSION`"
            echo "- Expected source SHA: `$EXPECTED_SOURCE_SHA`"
            if [[ "$observed" == true ]]; then
              echo '- State: **EXACT DEPLOY OBSERVED**'
              echo '- Evidence: `/health` returned status=ok, exact=true, matching version and commit SHA.'
            else
              echo '- State: **EXACT DEPLOY NOT OBSERVED**'
              echo '- Production Smoke remains a separate authenticated signal.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$observed" == true ]] || exit 1
