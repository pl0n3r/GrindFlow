name: GrindFlow Production Diagnostics

on:
  workflow_dispatch:

concurrency:
  group: grindflow-production-diagnostics
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnostics:
    name: production-diagnostics
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://www.grindflow.com.co
      E2E_USER_EMAIL: e2e-admin@grindflow.test
      E2E_USER_PASSWORD: ${{ secrets.PRODUCTION_E2E_PASSWORD }}
      OUTPUT_PATH: production-diagnostics.json
      LIMIT: '20'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize safe diagnostics artifact
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("production-diagnostics.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "generated_at": datetime.now(timezone.utc).isoformat(),
                      "ok": False,
                      "message": "Diagnostics capture did not complete.",
                      "entries": [],
                  },
                  handle,
                  indent=2,
              )
              handle.write("\n")
          PY

      - id: credentials
        name: Check synthetic credentials
        shell: bash
        run: |
          if [[ -n "$E2E_USER_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate diagnostics script
        if: steps.credentials.outputs.configured == 'true'
        run: bash -n scripts/fetch-production-diagnostics.sh

      - id: capture
        name: Capture sanitized production diagnostics
        if: steps.credentials.outputs.configured == 'true'
        continue-on-error: true
        shell: bash
        run: bash scripts/fetch-production-diagnostics.sh >/tmp/diagnostics-status.log 2>&1

      - name: Upload short-lived diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-diagnostics-${{ github.run_id }}
          path: production-diagnostics.json
          if-no-files-found: error
          retention-days: 3

      - name: Publish safe status to workflow summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.credentials.outputs.configured }}" != "true" ]]; then
            state="blocked: production E2E credentials are not configured"
          elif [[ "${{ steps.capture.outcome }}" == "success" ]]; then
            state="ready"
          else
            state="capture failed; inspect the short-lived artifact for the safe status payload"
          fi

          {
            echo "## Production diagnostics"
            echo
            echo "Status: **$state**"
            printf 'Run ID: `%s`\n' "$GITHUB_RUN_ID"
            printf 'Artifact: `production-diagnostics-%s`\n' "$GITHUB_RUN_ID"
            echo "Retention: **3 days**"
            echo
            echo "The workflow summary never contains the diagnostic payload."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail after publishing safe status
        if: >-
          always() &&
          (
            steps.credentials.outputs.configured != 'true' ||
            steps.capture.outcome == 'failure'
          )
        shell: bash
        run: exit 1
