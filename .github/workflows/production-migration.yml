name: GrindFlow Production Migration

on:
  workflow_dispatch:
    inputs:
      expected_pending:
        description: 'Exact pending migration count expected in production'
        required: true
        type: string

concurrency:
  group: grindflow-production-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: production-migration
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://www.grindflow.com.co
      E2E_USER_EMAIL: e2e-oidc-smoke@grindflow.test
      OUTPUT_PATH: production-migration-result.json
      EXPECTED_PENDING: ${{ inputs.expected_pending }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Initialize migration result
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("production-migration-result.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "generated_at": datetime.now(timezone.utc).isoformat(),
                      "ok": False,
                      "pending_before": None,
                      "pending_after": None,
                      "message": "Production migration did not complete.",
                  },
                  handle,
                  indent=2,
              )
              handle.write("\n")
          PY

      - id: credentials
        name: Check synthetic credentials
        shell: bash
        env:
          E2E_USER_PASSWORD: ${{ secrets.PRODUCTION_E2E_PASSWORD }}
        run: |
          if [[ -n "$E2E_USER_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate migration script
        if: steps.credentials.outputs.configured == 'true'
        run: bash -n scripts/run-production-migrations.sh

      - id: migrate
        name: Execute explicitly approved migration
        if: steps.credentials.outputs.configured == 'true'
        continue-on-error: true
        shell: bash
        env:
          E2E_USER_PASSWORD: ${{ secrets.PRODUCTION_E2E_PASSWORD }}
        run: bash scripts/run-production-migrations.sh

      - name: Upload migration result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-migration-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish safe status to workflow summary
        if: always()
        shell: bash
        run: |
          result_state="$(python3 - <<'PY'
          import json

          try:
              with open("production-migration-result.json", encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, UnicodeError, json.JSONDecodeError):
              print("ambiguous")
              raise SystemExit(0)

          ok = payload.get("ok") is True
          before = payload.get("pending_before")
          after = payload.get("pending_after")

          if ok and before == 0 and after == 0:
              print("no-op")
          elif ok and isinstance(before, int) and before > 0 and after == 0:
              print("applied")
          else:
              print("ambiguous")
          PY
          )"

          if [[ "${{ steps.credentials.outputs.configured }}" != "true" ]]; then
            state="blocked: production E2E credentials are not configured"
            backup_state="no ejecutado"
          elif [[ "${{ steps.migrate.outcome }}" != "success" ]]; then
            state="failed safely; inspect the result artifact"
            backup_state="no confirmado (falló el paso de migración)"
          elif [[ "$result_state" == "applied" ]]; then
            state="completed"
            backup_state="resolved and validated server-side"
          elif [[ "$result_state" == "no-op" ]]; then
            state="completed; no pending migrations"
            backup_state="no requerido (sin lote pendiente)"
          else
            state="failed safely; result evidence is ambiguous"
            backup_state="no confirmado (evidencia ambigua)"
          fi

          {
            echo "## Production migration"
            echo
            echo "Status: **$state**"
            printf 'Run ID: `%s`\n' "$GITHUB_RUN_ID"
            printf 'Artifact: `production-migration-%s-%s`\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Approved pending count: **%s**\n' "$EXPECTED_PENDING"
            printf 'Verified backup evidence: **%s**\n' "$backup_state"
            echo "Retention: **7 days**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail after publishing safe status
        if: >-
          always() &&
          (
            steps.credentials.outputs.configured != 'true' ||
            steps.migrate.outcome != 'success'
          )
        run: exit 1
