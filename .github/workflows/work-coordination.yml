name: Coordinación

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  issues:
    types: [labeled, closed, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: coordinacion-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  clasificar-comentario:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.sender.login == github.event.comment.user.login
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      valido: ${{ steps.validar.outputs.valido }}
    steps:
      - id: validar
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Clasificación sin interpretar como shell el comentario del usuario.
          # Gramática de SESSION_RE y parse_comment_command en Factory@v1.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          body = os.environ["COMMENT_BODY"].strip()
          exactos = {"/tomar", "/liberar-forzado", "/adoptar-contrato-huerfana"}
          prefijos = ("/liberar ", "/transferir ", "/migrar-contrato ", "/renovar-contrato ")
          uuid = re.compile(
              r"^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-"
              r"[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          )
          valido = body in exactos or any(
              body.startswith(prefix)
              and uuid.fullmatch(body[len(prefix):].strip().lower()) is not None
              for prefix in prefijos
          )
          print("valido=" + ("true" if valido else "false"))
          PY

  comentario:
    needs: clasificar-comentario
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.sender.login == github.event.comment.user.login &&
      needs['clasificar-comentario'].outputs.valido == 'true'
    # GitHub valida el máximo permission envelope del reusable antes de
    # seleccionar el job interno. El reusable conserva mínimo privilegio por job.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: comment
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.event.comment.user.login }}
      association: ${{ github.event.comment.author_association }}
      body: ${{ github.event.comment.body }}

      profile: es
  etiqueta:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'estado: reservado'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: label
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.event.sender.login }}
      label: ${{ github.event.label.name }}

      profile: es
  pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # GitHub valida el máximo permiso del reusable completo antes de evaluar
    # qué operación interna se ejecutará. La operación pr sigue estrechando
    # permisos dentro de Factory.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: pr
      pr_number: ${{ github.event.pull_request.number }}
      action: ${{ github.event.action }}

      profile: es
  validar-pr:
    if: >-
      github.event_name == 'pull_request' &&
      !(
        startsWith(github.event.pull_request.head.ref, 'factory/bootstrap-coordination-') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.author_association == 'OWNER'
      )
    # Mismo sobre de carga; el job validar-pr del reusable conserva permisos
    # read-only (contents/issues/pull-requests: read).
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: validate
      pr_number: ${{ github.event.pull_request.number }}
      require_reservation: true

      profile: es
  issue:
    if: github.event_name == 'issues' && (github.event.action == 'closed' || github.event.action == 'reopened')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: issue
      issue_number: ${{ github.event.issue.number }}
      action: ${{ github.event.action }}

      profile: es
  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: sweep
      profile: es

  post-merge-exact-main-ci:
    name: CI exact-main post-merge
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch GrindFlow CI on exact main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run grindflow-ci.yml --ref main
