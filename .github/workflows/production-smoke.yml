name: GrindFlow Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: grindflow-production-smoke
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  current-main:
    name: current-main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      current: ${{ steps.guard.outputs.current }}
      remote_sha: ${{ steps.guard.outputs.remote_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: guard
        name: Reject stale main event
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/current-main-event-guard.sh

  stale-event:
    name: stale-main-event
    needs: current-main
    if: needs.current-main.outputs.current != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record ignored stale event
        run: |
          {
            echo '## Stale main event ignored'
            echo
            echo "Event SHA: \`$GITHUB_SHA\`"
            echo "Current main: \`${{ needs.current-main.outputs.remote_sha }}\`"
            echo 'No production I/O or release mutation was executed.'
          } >> "$GITHUB_STEP_SUMMARY"

  production-smoke:
    name: production-smoke
    needs: current-main
    if: needs.current-main.outputs.current == 'true'
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://www.grindflow.com.co
      E2E_USER_EMAIL: e2e-oidc-smoke@grindflow.test
      E2E_USER_PASSWORD: ${{ secrets.PRODUCTION_E2E_PASSWORD }}
      EXPECTED_SHA: ${{ github.sha }}
      ATTEMPTS: '15'
      WAIT_SECONDS: '20'
      FAILURE_ISSUE_TITLE: '[AUTO] Production Smoke Failure'
      CONFIG_ISSUE_TITLE: '[AUTO] Production Smoke Not Configured'
      MEDIA_STORAGE_ISSUE_TITLE: '[AUTO] Media Storage Not Configured'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - id: credentials
        name: Check synthetic credentials
        shell: bash
        run: |
          if [[ -n "$E2E_USER_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Production E2E credentials are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Production smoke skipped"
              echo
              echo "Repository secret PRODUCTION_E2E_PASSWORD is not configured."
              echo "Configure it once in GitHub repository Actions secrets; no SSH is required."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report missing smoke credentials
        if: steps.credentials.outputs.configured == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue_number="$(gh issue list --state open --search "$CONFIG_ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')"

          if [[ -z "$issue_number" ]]; then
            cat > /tmp/grindflow-config-issue.md <<'EOF'
          The authenticated production smoke cannot run because the repository
          secret `PRODUCTION_E2E_PASSWORD` is not configured.

          This is a one-time GitHub configuration task. No SSH is required.

          Until it is configured, GrindFlow cannot automatically verify the
          authenticated Dashboard/System routes or publish application diagnostics
          from production failures.
          EOF

            gh issue create --title "$CONFIG_ISSUE_TITLE" --body-file /tmp/grindflow-config-issue.md
          fi

      - name: Close missing-credentials notice
        if: steps.credentials.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue_number="$(gh issue list --state open --search "$CONFIG_ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')"

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body "Production E2E credentials are now configured. Closing this automatic notice."
            gh issue close "$issue_number"
          fi

      - id: deployed_checkout
        name: Wait for exact deployed checkout before production write
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          health_body="$(mktemp)"
          trap 'rm -f "$health_body"' EXIT

          for attempt in $(seq 1 "$ATTEMPTS"); do
            status="$(curl --silent --show-error --max-time 20               --output "$health_body"               --write-out '%{http_code}'               "$BASE_URL/health?probe=$GITHUB_RUN_ID-$attempt" || true)"

            if [[ "$status" == "200" ]] && jq -e --arg sha "$GITHUB_SHA"               'type == "object" and .status == "ok" and .exact == true and .commit == $sha'               "$health_body" >/dev/null; then
              exit 0
            fi

            if [[ "$attempt" -lt "$ATTEMPTS" ]]; then
              sleep "$WAIT_SECONDS"
            fi
          done

          echo "::error::Production never exposed the exact main SHA through /health."
          exit 1

      - id: synthetic_bootstrap
        name: Reconcile synthetic smoke identity through GitHub OIDC
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          payload="$(mktemp)"
          response_headers="$(mktemp)"
          trap 'rm -f "$payload" "$response_headers"' EXIT
          chmod 600 "$payload"
          failure_stage="unknown"
          failure_code="unknown"

          GRINDFLOW_SMOKE_PASSWORD="$E2E_USER_PASSWORD" python3 - "$payload" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump({"password": os.environ["GRINDFLOW_SMOKE_PASSWORD"]}, handle)
          PY

          bootstrap_status=0
          for attempt in 1 2 3; do
            if ! oidc_response="$(curl --silent --show-error --fail --max-time 20               --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=grindflow-production-smoke-bootstrap")"; then
              bootstrap_status="oidc-request-failed"
              if [[ "$attempt" -lt 3 ]]; then sleep 2; fi
              continue
            fi

            if ! oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' <<<"$oidc_response")"; then
              bootstrap_status="oidc-token-invalid"
              unset oidc_response
              if [[ "$attempt" -lt 3 ]]; then sleep 2; fi
              continue
            fi
            printf '::add-mask::%s\n' "$oidc_token"

            : > "$response_headers"
            bootstrap_status="$(curl --silent --show-error --max-time 20               --dump-header "$response_headers"               --output /dev/null               --write-out '%{http_code}'               --request POST               --header "Authorization: Bearer $oidc_token"               --header "Content-Type: application/json"               --header "X-GrindFlow-Expected-Sha: $GITHUB_SHA"               --data-binary "@$payload"               "$BASE_URL/internal/production-smoke/bootstrap" || true)"
            unset oidc_token oidc_response

            if [[ "$bootstrap_status" == "204" ]]; then
              echo "Synthetic production smoke identity reconciled through verified GitHub OIDC." >> "$GITHUB_STEP_SUMMARY"
              break
            fi

            # A reconciliation 503 is deterministic for this checkout. Do not
            # repeat potentially mutating operations; only report allowlisted codes.
            if [[ "$bootstrap_status" == "503" ]]; then
              failure_stage="$(awk -F ': *' 'tolower($1) == "x-grindflow-smoke-failure-stage" {gsub(/\r/, "", $2); print $2; exit}' "$response_headers")"
              failure_code="$(awk -F ': *' 'tolower($1) == "x-grindflow-smoke-failure-code" {gsub(/\r/, "", $2); print $2; exit}' "$response_headers")"
              case "$failure_stage" in environment|config-clear|provision-user) ;; *) failure_stage="unknown";; esac
              case "$failure_code" in
                password-invalid|provision-phase-disabled|provision-password-missing|provision-email-invalid|provision-name-invalid|provision-lock-directory-failed|provision-lock-open-failed|provision-lock-timeout|provision-membership-conflict|provision-backup-write-failed|provision-backup-permission-failed|provision-database-failed|env-unavailable|lock-unavailable|lock-failed|env-read-failed|backup-write-failed|backup-permission-failed|stage-unavailable|stage-write-failed|stage-permission-failed|env-publish-failed|config-clear-failed|provision-failed)
                  ;;
                *) failure_code="unexpected";;
              esac
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep 2; fi
          done

          if [[ "$bootstrap_status" != "204" ]]; then
            echo "BOOTSTRAP_FAILURE_STAGE=$failure_stage" >> "$GITHUB_ENV"
            echo "BOOTSTRAP_FAILURE_CODE=$failure_code" >> "$GITHUB_ENV"
            echo "::error::Synthetic production identity bootstrap failed with HTTP $bootstrap_status; stage=$failure_stage code=$failure_code; no login attempt will be sent."
            exit 1
          fi

      - name: Publish pre-login production failure
        if: failure() && steps.credentials.outputs.configured == 'true' && (steps.deployed_checkout.outcome == 'failure' || steps.synthetic_bootstrap.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_CHECK_OUTCOME: ${{ steps.deployed_checkout.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          stage="oidc-bootstrap"
          if [[ "$DEPLOY_CHECK_OUTCOME" == "failure" ]]; then
            stage="exact-health"
          fi

          {
            echo "## Production smoke blocked before login"
            echo
            echo "Stage: $stage"
            if [[ "$stage" == "oidc-bootstrap" ]]; then
              echo "Reconciliation stage: ${BOOTSTRAP_FAILURE_STAGE:-unknown}"
              echo "Reconciliation code: ${BOOTSTRAP_FAILURE_CODE:-unknown}"
            fi
            echo "No login was attempted. Inspect the failed workflow step for details."
            echo "Workflow source SHA (not the verified deployed checkout): $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "No request bodies, credentials, OIDC tokens or remote responses are included."
          } > /tmp/grindflow-prelogin-failure.md

          cat /tmp/grindflow-prelogin-failure.md >> "$GITHUB_STEP_SUMMARY"
          issue_number="$(gh issue list --state open --search "$FAILURE_ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')"

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body-file /tmp/grindflow-prelogin-failure.md
          else
            gh issue create --title "$FAILURE_ISSUE_TITLE" --body-file /tmp/grindflow-prelogin-failure.md --label 'tipo: incidente' --label 'prioridad: crítica' --label 'estado: disponible'
          fi

      - name: Validate smoke script
        if: steps.credentials.outputs.configured == 'true'
        run: bash -n scripts/production-smoke.sh

      - id: smoke
        name: Authenticated production smoke
        if: steps.credentials.outputs.configured == 'true'
        continue-on-error: true
        shell: bash
        run: bash scripts/production-smoke.sh >production-smoke.log 2>&1

      - name: Report media storage readiness
        if: steps.credentials.outputs.configured == 'true' && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue_number="$(gh issue list --state open --search "$MEDIA_STORAGE_ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')"

          if grep -Fq 'MEDIA_STORAGE_READY=1' production-smoke.log; then
            echo "Media object storage is configured." >> "$GITHUB_STEP_SUMMARY"

            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" --body "Media object storage is now configured on production commit $GITHUB_SHA. Closing this automatic notice."
              gh issue close "$issue_number"
            fi
          else
            {
              echo "## Media object storage setup required"
              echo
              echo "Production smoke passed, but Direct upload storage is not configured."
              echo "Quick upload remains available."
              echo
              echo "Workflow source SHA (not the verified deployed checkout): $GITHUB_SHA"
              echo "Target: $BASE_URL"
              echo
              echo "Configure the S3-compatible media storage environment and bucket CORS."
              echo "No SSH is required if the hosting/provider UI exposes environment settings."
            } > /tmp/grindflow-media-storage.md

            cat /tmp/grindflow-media-storage.md >> "$GITHUB_STEP_SUMMARY"

            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" --body-file /tmp/grindflow-media-storage.md
            else
              gh issue create --title "$MEDIA_STORAGE_ISSUE_TITLE" --body-file /tmp/grindflow-media-storage.md
            fi
          fi

      - name: Reconcile media web-runtime readiness
        if: steps.credentials.outputs.configured == 'true' && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MEDIA_READINESS_ISSUE: '307'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${MEDIA_WEB_RUNTIME_EVIDENCE_PATH:-}" ]]; then
            evidence_file="$MEDIA_WEB_RUNTIME_EVIDENCE_PATH"
          else
            evidence_file="$(mktemp "${RUNNER_TEMP:-/tmp}/grindflow-media-web-runtime.XXXXXX")"
          fi

          marker_value() {
            local marker="$1"
            local matches=()
            mapfile -t matches < <(grep -E "^$marker=(ready|not_ready)$" production-smoke.log || true)
            if [[ "${#matches[@]}" != "1" ]]; then
              return 1
            fi
            printf '%s\n' "${matches[0]#*=}"
          }

          diagnostic_reason() {
            local matches=()
            mapfile -t matches < <(grep -E '^MEDIA_WEB_RUNTIME_DIAGNOSTIC=(observed|endpoint_unreachable|http_non_200|contract_invalid)$' production-smoke.log || true)
            if [[ "${#matches[@]}" != "1" ]]; then
              printf 'markers_absent\n'
              return
            fi
            printf '%s\n' "${matches[0]#*=}"
          }

          ready_count="$(grep -Fxc 'MEDIA_WEB_RUNTIME_READY=1' production-smoke.log || true)"
          blocked_count="$(grep -Fxc 'MEDIA_WEB_RUNTIME_READY=0' production-smoke.log || true)"
          diagnostics_available=false
          diagnostic_state="$(diagnostic_reason)"
          decoder_state=''
          temporary_storage_state=''
          private_vault_state=''

          if [[ "$diagnostic_state" == "observed" ]] \
            && decoder_state="$(marker_value MEDIA_WEB_RUNTIME_CHECK_DECODER)" \
            && temporary_storage_state="$(marker_value MEDIA_WEB_RUNTIME_CHECK_TEMPORARY_STORAGE)" \
            && private_vault_state="$(marker_value MEDIA_WEB_RUNTIME_CHECK_PRIVATE_VAULT)"; then
            diagnostics_available=true
          elif [[ "$diagnostic_state" == "observed" ]]; then
            diagnostic_state='markers_absent'
          fi

          if [[ "$ready_count" == "1" && "$blocked_count" == "0" \
            && "$diagnostics_available" == "true" \
            && "$decoder_state" == "ready" \
            && "$temporary_storage_state" == "ready" \
            && "$private_vault_state" == "ready" ]]; then
            {
              echo '## Media web runtime ready'
              echo
              printf 'Exact deployed SHA: `%s`\n' "$GITHUB_SHA"
              echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo 'Contract: `media-pilot-readiness-v1`'
              echo 'Evidence scope: `web_runtime`'
              echo 'Status: `ready`'
              printf -- '- decoder: `%s`\n' "$decoder_state"
              printf -- '- temporary_storage: `%s`\n' "$temporary_storage_state"
              printf -- '- private_vault: `%s`\n' "$private_vault_state"
              echo
              echo 'The remote readiness body, filesystem paths, cookies, hashes and secrets are intentionally omitted.'
            } > "$evidence_file"
            cat "$evidence_file" >> "$GITHUB_STEP_SUMMARY"

            issue_state="$(gh issue view "$MEDIA_READINESS_ISSUE" --json state --jq '.state')"
            if [[ "$issue_state" == "OPEN" ]]; then
              gh issue comment "$MEDIA_READINESS_ISSUE" --body-file "$evidence_file"
              gh issue edit "$MEDIA_READINESS_ISSUE" --remove-label 'estado: bloqueado' --add-label 'estado: completado'
              gh issue close "$MEDIA_READINESS_ISSUE"
            fi
          else
            {
              echo '## Media web runtime remains blocked'
              echo
            } >> "$GITHUB_STEP_SUMMARY"

            if [[ "$diagnostics_available" == "true" ]]; then
              run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              blocked_marker="<!-- grindflow-media-runtime-blocked-v1 sha=$GITHUB_SHA run=$GITHUB_RUN_ID -->"
              {
                echo "$blocked_marker"
                printf 'Exact deployed SHA: `%s`\n' "$GITHUB_SHA"
                echo "Run: $run_url"
                echo 'Status: `BLOCKED_TARGET_ENV`'
                printf -- '- decoder: `%s`\n' "$decoder_state"
                printf -- '- temporary_storage: `%s`\n' "$temporary_storage_state"
                printf -- '- private_vault: `%s`\n' "$private_vault_state"
              } > "$evidence_file"
              cat "$evidence_file" >> "$GITHUB_STEP_SUMMARY"

              existing_comments="$(gh issue view "$MEDIA_READINESS_ISSUE" --json comments --jq '.comments[].body')"
              if ! grep -Fq -- "$blocked_marker" <<<"$existing_comments"; then
                gh issue comment "$MEDIA_READINESS_ISSUE" --body-file "$evidence_file"
              fi
            else
              unavailable_marker="<!-- grindflow-media-runtime-unavailable-v1 sha=$GITHUB_SHA run=$GITHUB_RUN_ID -->"
              {
                echo "$unavailable_marker"
                echo 'Media web runtime: diagnóstico no disponible'
                printf 'Exact deployed SHA: `%s`\n' "$GITHUB_SHA"
                echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                echo 'Status: `BLOCKED_TARGET_ENV`'
                printf 'Cause: `%s`\n' "$diagnostic_state"
                echo 'No remote response body, filesystem path, cookie, header, hash or secret was published.'
              } > "$evidence_file"
              cat "$evidence_file" >> "$GITHUB_STEP_SUMMARY"

              existing_comments="$(gh issue view "$MEDIA_READINESS_ISSUE" --json comments --jq '.comments[].body')"
              if ! grep -Fq -- "$unavailable_marker" <<<"$existing_comments"; then
                gh issue comment "$MEDIA_READINESS_ISSUE" --body-file "$evidence_file"
              fi
            fi

            {
              echo
              echo 'Issue #307 remains open. No remote response body, filesystem path, cookie, header, hash or secret was published.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload short-lived smoke diagnostics
        if: steps.credentials.outputs.configured == 'true' && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: production-smoke-diagnostics-${{ github.run_id }}
          path: production-smoke.log
          if-no-files-found: error
          retention-days: 3

      - name: Publish production failure diagnostics
        if: steps.credentials.outputs.configured == 'true' && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            if grep -Eq '^MIGRATIONS_PENDING=[1-9][0-9]*$' production-smoke.log; then
              pending="$(grep -E '^MIGRATIONS_PENDING=[1-9][0-9]*$' production-smoke.log | tail -1 | cut -d= -f2)"
              echo "## Production smoke blocked by pending migrations"
              echo
              echo "Pending migration count: **$pending**"
              if grep -Fxq 'VAULT_READ_ONLY=ok' production-smoke.log; then
                echo "Authenticated read-only Vault check passed despite pending migrations."
              elif grep -Fxq 'VAULT_READ_ONLY=failed' production-smoke.log; then
                echo "**Additional defect:** authenticated read-only Vault check failed. Inspect the short-lived diagnostics artifact; do not classify the failure as migrations alone."
              else
                echo "Authenticated read-only Vault check was not completed."
              fi
              echo "Inspect the exact pending batch in Admin > System and verify an external restorable backup before approving migrations."
              echo "This workflow never executes migrations."
            else
              echo "## Production smoke failed"
              echo
              echo "Cause: inspect the short-lived diagnostic artifact."
            fi
            echo
            # Parse only allowlisted local signals; never publish log lines or remote HTML.
            if python3 scripts/production-smoke-auth-triage.py --markdown < production-smoke.log; then
              :
            else
              echo "Authentication signal summary unavailable; inspect the short-lived artifact."
            fi
            echo
            # Publish only strict allowlisted release metadata; never response HTML.
            expected_line="$(grep -E '^RELEASE_UI_EXPECTED=v[0-9]+[.][0-9]+[.][0-9]+$' production-smoke.log | tail -n 1 || true)"
            observed_line="$(grep -E '^RELEASE_UI_OBSERVED=(v[0-9]+[.][0-9]+[.][0-9]+|unknown)$' production-smoke.log | tail -n 1 || true)"
            if [[ -n "$expected_line" ]]; then
              echo "Expected human release: ${expected_line#*=}"
              if [[ -n "$observed_line" ]]; then
                echo "Observed human release: ${observed_line#*=}"
              else
                echo "Observed human release: not reached by read-only smoke"
              fi
              echo "Human release label does not establish the deployed Git SHA."
              echo
            fi
            echo "Workflow source SHA (not the verified deployed checkout): $GITHUB_SHA"
            echo "Target: $BASE_URL"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Artifact: production-smoke-diagnostics-$GITHUB_RUN_ID"
            echo "Retention: 3 days"
            echo
            echo "The diagnostic payload is kept out of the public issue body."
            echo "Authorized agents can retrieve the short-lived artifact through GitHub."
          } > /tmp/grindflow-production-failure.md

          cat /tmp/grindflow-production-failure.md >> "$GITHUB_STEP_SUMMARY"

          issue_number="$(gh issue list --state open --search "$FAILURE_ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')"

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body-file /tmp/grindflow-production-failure.md
          else
            gh issue create --title "$FAILURE_ISSUE_TITLE" --body-file /tmp/grindflow-production-failure.md
          fi

      - name: Publish production recovery
        if: steps.credentials.outputs.configured == 'true' && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "## Production smoke passed"
            echo
            echo "Workflow source SHA: $GITHUB_SHA"
            echo "Target: $BASE_URL"
            echo "Checked: exact /health, /, /login, authenticated /dashboard, /admin/system, organization Vault, Scheduler, Distribution, Traffic, Finance, CSV GET"
            echo "Observed release: $(grep -E '^HEALTH_VERSION=' production-smoke.log | tail -1 | cut -d= -f2)"
            echo "Exact deployed Git SHA: $(grep -E '^HEALTH_SHA=[0-9a-f]{40}$' production-smoke.log | tail -1 | cut -d= -f2)"
          } >> "$GITHUB_STEP_SUMMARY"

          issue_number="$(gh issue list --state open --search "$FAILURE_ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')"

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body "Production smoke recovered on commit $GITHUB_SHA. Closing the automatic incident."
            gh issue close "$issue_number"
          fi

      - name: Fail workflow after publishing diagnostics
        if: steps.credentials.outputs.configured == 'true' && steps.smoke.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Fail unconfigured authenticated production smoke
        if: steps.credentials.outputs.configured == 'false'
        shell: bash
        run: |
          echo '::error::Authenticated production smoke was not executed: PRODUCTION_E2E_PASSWORD is missing.'
          exit 1