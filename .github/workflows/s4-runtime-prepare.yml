name: S4 Runtime Prepare

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact full SHA of current main to prepare'
        required: true
        type: string
      vendor_backup_sha256:
        description: 'SHA-256 of previously verified persistent vendor archive'
        required: true
        type: string
      authorization_comment_id:
        description: 'Owner approval comment on issue #903, bound to SHA and archive hash'
        required: true
        type: string
      confirm_runtime_write:
        description: 'I authorize this specific protected vendor replacement'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: read

concurrency:
  group: grindflow-s4-runtime-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: exact-s4-runtime-prepare
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_runtime_write == true
    environment: production-s4-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OBSERVED_SHA: ${{ inputs.expected_sha }}
      EVENT_SHA: ${{ github.sha }}
      BACKUP_SHA256: ${{ inputs.vendor_backup_sha256 }}
      AUTH_COMMENT_ID: ${{ inputs.authorization_comment_id }}
      PRODUCTION_URL: https://www.grindflow.com.co
    steps:
      - id: authorization
        name: Require fresh OWNER decision bound to main and verified backup hash
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]] || exit 1
          [[ "$GITHUB_TRIGGERING_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]] || exit 1
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || exit 1
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ && "$EVENT_SHA" == "$GITHUB_SHA" ]] || exit 1
          [[ "$OBSERVED_SHA" =~ ^[0-9a-f]{40}$ && "$OBSERVED_SHA" == "$GITHUB_SHA" ]] || exit 1
          [[ "$BACKUP_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ "$AUTH_COMMENT_ID" =~ ^[1-9][0-9]{0,15}$ ]] || exit 1
          approval="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$AUTH_COMMENT_ID")" || exit 1
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" \
                --arg repo "$GITHUB_REPOSITORY" \
                --arg sha "$OBSERVED_SHA" \
                --arg backup "$BACKUP_SHA256" '
            .user.login == $owner and
            .issue_url == ("https://api.github.com/repos/" + $repo + "/issues/903") and
            .body == ("S4_RUNTIME_PREPARE_APPROVED\nSHA=" + $sha + "\nVENDOR_BACKUP_SHA256=" + $backup)
          ' <<< "$approval" >/dev/null || exit 1
          approved_at="$(jq -r '.created_at' <<< "$approval")"
          approved_epoch="$(date -u -d "$approved_at" +%s)"
          now_epoch="$(date -u +%s)"
          (( now_epoch >= approved_epoch && now_epoch - approved_epoch <= 3600 )) || exit 1
          echo 'authorized=true' >> "$GITHUB_OUTPUT"
          echo 'Fresh exact-SHA owner approval recorded on #903; runtime guard continues.' >> "$GITHUB_STEP_SUMMARY"

      - id: current
        name: Resolve trusted current-main SHA before production I/O
        if: steps.authorization.outputs.authorized == 'true'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$OBSERVED_SHA" =~ ^[0-9a-f]{40}$ && "$OBSERVED_SHA" == "$GITHUB_SHA" ]] || exit 1
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
          [[ "$DEFAULT_BRANCH" != -* && "$DEFAULT_BRANCH" != *..* && "$DEFAULT_BRANCH" != *//* ]] || exit 1

          remote_ref="refs/heads/$DEFAULT_BRANCH"
          remote="$(git ls-remote --heads "https://github.com/$GITHUB_REPOSITORY.git" "$remote_ref")"
          [[ "$(printf '%s\n' "$remote" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')" == "1" ]] || exit 1

          trusted_sha="$(awk 'NR == 1 {print $1}' <<< "$remote")"
          trusted_ref="$(awk 'NR == 1 {print $2}' <<< "$remote")"
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ && "$trusted_ref" == "$remote_ref" ]] || exit 1

          if [[ "$trusted_sha" != "$OBSERVED_SHA" ]]; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Observed deploy is no longer current-main; no production I/O executed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'current=true' >> "$GITHUB_OUTPUT"
          echo "trusted_sha=$trusted_sha" >> "$GITHUB_OUTPUT"

      - id: helper
        name: Fetch helper only from trusted current-main SHA
        if: steps.current.outputs.current == 'true'
        shell: bash
        env:
          TRUSTED_SHA: ${{ steps.current.outputs.trusted_sha }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          helper="$(mktemp)"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --output "$helper" \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TRUSTED_SHA/scripts/prepare-s4-runtime.sh"
          bash -n "$helper"
          echo "path=$helper" >> "$GITHUB_OUTPUT"

      - name: Prepare Symfony dependencies on exact hPanel checkout
        if: steps.current.outputs.current == 'true'
        shell: bash
        env:
          TRUSTED_SHA: ${{ steps.current.outputs.trusted_sha }}
          HELPER_PATH: ${{ steps.helper.outputs.path }}
          SSH_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ vars.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          GIT_ROOT: ${{ vars.HOSTINGER_GIT_ROOT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$BACKUP_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ -f "$HELPER_PATH" ]] || { echo '::error::Trusted helper was not materialized'; exit 1; }
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ && "$SSH_HOST" != -* ]] || { echo '::error::Invalid SSH host configuration'; exit 1; }
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ && "$SSH_USER" != -* ]] || { echo '::error::Invalid SSH user configuration'; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo '::error::Invalid SSH port configuration'; exit 1; }
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || { echo '::error::Invalid SSH port range'; exit 1; }
          [[ "$GIT_ROOT" =~ ^/[A-Za-z0-9._/-]+$ && "$GIT_ROOT" != '/' && "$GIT_ROOT" != *'..'* && "$GIT_ROOT" != *'//'* ]] \
            || { echo '::error::Invalid hPanel Git root configuration'; exit 1; }
          [[ -n "$DEPLOY_SSH_KEY" && -n "$HOSTINGER_KNOWN_HOSTS" ]] \
            || { echo '::error::S4 runtime prepare SSH material is not configured'; exit 1; }

          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir" "$HELPER_PATH"' EXIT
          key="$ssh_dir/key"
          known="$ssh_dir/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > "$known"
          chmod 600 "$key" "$known"

          ssh_args=(
            -p "$SSH_PORT"
            -i "$key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$known"
            -o ConnectTimeout=10
          )
          # The persistent archive must already exist. Never create/overwrite it here.
          # Verify the SHA-256 and archive contents in the SAME remote shell
          # immediately before running the authorized Composer helper.
          {
            cat <<'BACKUP_GUARD'
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$EXPECTED_BACKUP_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 1
          [[ -n "${HOME:-}" && -d "$HOME/.grindflow/runtime-backups" &&
             ! -L "$HOME/.grindflow/runtime-backups" ]] || exit 1
          archive="$HOME/.grindflow/runtime-backups/vendor-prep-${EXPECTED_SHA}.tar.gz"
          [[ -f "$archive" && ! -L "$archive" && -s "$archive" ]] || exit 1
          [[ -f "symfony/vendor/autoload.php" && ! -L "symfony/vendor" ]] || exit 1
          actual="$(sha256sum -- "$archive" | cut -d' ' -f1)"
          [[ "$actual" == "$EXPECTED_BACKUP_SHA" ]] || exit 1
          tar -tzf "$archive" 2>/dev/null | awk '
            /^\// || /(^|\/)\.\.(\/|$)/ { unsafe = 1 }
            $0 == "vendor/autoload.php" { autoload = 1 }
            $0 != "vendor/" && $0 !~ /^vendor\// { unsafe = 1 }
            END { exit unsafe || !autoload }
          ' || exit 1
          # Safe restore: forbid symlinks, hardlinks and special file types.
          # No archive filenames are emitted to Actions logs.
          tar -tvzf "$archive" 2>/dev/null | awk '
            substr($0, 1, 1) != "-" && substr($0, 1, 1) != "d" { exit 1 }
          ' || exit 1
          printf 'S4_RUNTIME_BACKUP_VERIFIED\n'
          BACKUP_GUARD
            cat "$HELPER_PATH"
          } | ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" \
            "cd '$GIT_ROOT' && EXPECTED_SHA='$TRUSTED_SHA' EXPECTED_BACKUP_SHA='$BACKUP_SHA256' bash -s"

      - name: Reconfirm trusted current-main SHA after preparation
        if: steps.current.outputs.current == 'true'
        shell: bash
        env:
          TRUSTED_SHA: ${{ steps.current.outputs.trusted_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          remote_ref="refs/heads/$DEFAULT_BRANCH"
          remote="$(git ls-remote --heads "https://github.com/$GITHUB_REPOSITORY.git" "$remote_ref")"
          [[ "$(printf '%s\n' "$remote" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')" == "1" ]] || exit 1
          remote_sha="$(awk 'NR == 1 {print $1}' <<< "$remote")"
          remote_name="$(awk 'NR == 1 {print $2}' <<< "$remote")"
          [[ "$remote_sha" == "$TRUSTED_SHA" && "$remote_name" == "$remote_ref" ]] \
            || { echo '::error::main changed during S4 runtime preparation'; exit 1; }

      - name: Verify S4 bridge no longer reports runtime_unavailable
        if: steps.current.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error --connect-timeout 3 --max-time 10 \
            --output "$body" --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            "$PRODUCTION_URL/s4/_bridge-readiness?probe=$GITHUB_RUN_ID")"
          state="$(jq -r 'if type == "object" and (.data | type) == "object" and (.data.state | type) == "string" then .data.state else "invalid" end' "$body" 2>/dev/null || printf invalid)"
          case "$status:$state" in
            200:ready_for_web_probe)
              echo 'S4 runtime dependencies prepared; bridge is ready for the web probe.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            503:config_missing|503:schema_missing|503:identity_unavailable)
              printf 'S4 runtime dependencies prepared; next fail-closed blocker: `%s`.\n' "$state" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo '::error::S4 bridge still lacks runtime readiness or returned an invalid state.'
              exit 1
              ;;
          esac
