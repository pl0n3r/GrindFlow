name: Deploy Factory v1 (inactive until cutover)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grindflow-factory-deploy
  cancel-in-progress: false

jobs:
  current-main:
    name: current-main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      current: ${{ steps.guard.outputs.current }}
      remote_sha: ${{ steps.guard.outputs.remote_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: guard
        name: Reject stale main event
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/current-main-event-guard.sh

  stale-event:
    name: stale-main-event
    needs: current-main
    if: needs.current-main.outputs.current != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record ignored stale event
        run: |
          {
            echo '## Stale main event ignored'
            echo
            echo "Event SHA: \`$GITHUB_SHA\`"
            echo "Current main: \`${{ needs.current-main.outputs.remote_sha }}\`"
            echo 'No production I/O or release mutation was executed.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: current-main
    if: needs.current-main.outputs.current == 'true' && vars.FACTORY_DEPLOY_ENABLED == 'true'
    uses: pl0n3r/factory/.github/workflows/deploy.yml@v1
    with:
      domain: https://www.grindflow.com.co
      health_path: /health
      version_source: config/version.php
      version_format: php-array
      version_key: number
      phase: construccion
      migration_mode: none
      transport: hostinger-ssh
      hostinger_ssh_host: ${{ vars.HOSTINGER_SSH_HOST }}
      hostinger_ssh_user: ${{ vars.HOSTINGER_SSH_USER }}
      hostinger_ssh_port: ${{ vars.HOSTINGER_SSH_PORT }}
      hostinger_release_root: ${{ vars.HOSTINGER_RELEASE_ROOT }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
