framework:
  secret: '%env(APP_SECRET)%'
  handle_all_throwables: true
  http_method_override: false
  router:
    utf8: true
  session:
    handler_id: null
    cookie_secure: auto
    cookie_httponly: true
    cookie_samesite: lax
  csrf_protection: true

  # The account password endpoint is more sensitive than the login form:
  # attempts are scoped to the authenticated account, not a browser session.
  rate_limiter:
    profile_password:
      policy: sliding_window
      limit: 8
      interval: '15 minutes'
    password_recovery_ip:
      policy: fixed_window
      limit: 20
      interval: '1 hour'
    password_recovery_account:
      policy: fixed_window
      limit: 5
      interval: '1 hour'
    password_reset_ip:
      policy: sliding_window
      limit: 12
      interval: '15 minutes'
    password_reset_account:
      policy: sliding_window
      limit: 8
      interval: '15 minutes'
