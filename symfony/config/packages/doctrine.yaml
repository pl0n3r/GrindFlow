doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
    use_savepoints: true
  orm:
    auto_mapping: false
    mappings:
      GrindFlowIdentity:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/src/Identity/Entity'
        prefix: 'GrindFlow\Identity\Entity'
        alias: GrindFlowIdentity
