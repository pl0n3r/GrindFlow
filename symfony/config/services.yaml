parameters:
  grindflow_vault_root_default: ''
  grindflow_direct_upload_secret_default: ''
  grindflow_mail_from_default: ''
  grindflow_public_base_url_default: 'https://www.grindflow.com.co'
  grindflow_ops_keys_json_default: '{}'
  grindflow_ops_allowlist_default: ''
  grindflow_ops_rate_limit_default: 60

services:
  _defaults:
    autowire: true
    autoconfigure: true

  GrindFlow\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'

  GrindFlow\Shared\Version\ProductVersion:
    arguments:
      $repositoryDir: '%kernel.project_dir%/..'

  GrindFlow\Http\AssetManifest:
    arguments:
      $projectDir: '%kernel.project_dir%'

  GrindFlow\Infrastructure\Storage\PrivateVaultDirectory:
    arguments:
      $projectDir: '%kernel.project_dir%'
      $rootOverride: '%env(default:grindflow_vault_root_default:GRINDFLOW_VAULT_ROOT)%'

  GrindFlow\Infrastructure\Storage\DirectUploadStorage:
    alias: GrindFlow\Infrastructure\Storage\UnavailableDirectUploadStorage

  GrindFlow\Infrastructure\Storage\DirectUploadTokenCipher:
    arguments:
      $secret: '%env(default:grindflow_direct_upload_secret_default:GRINDFLOW_DIRECT_UPLOAD_SECRET)%'

  GrindFlow\Infrastructure\Storage\VaultStageCommand:
    arguments:
      $projectDir: '%kernel.project_dir%'

  GrindFlow\Infrastructure\Storage\VaultVerifyStageCommand:
    arguments:
      $projectDir: '%kernel.project_dir%'

  GrindFlow\Infrastructure\Mail\NativePasswordRecoveryNotifier:
    arguments:
      $from: '%env(default:grindflow_mail_from_default:GRINDFLOW_MAIL_FROM)%'
      $publicBaseUrl: '%env(default:grindflow_public_base_url_default:GRINDFLOW_PUBLIC_BASE_URL)%'

  GrindFlow\Identity\Security\PasswordRecoveryNotifier:
    alias: GrindFlow\Infrastructure\Mail\NativePasswordRecoveryNotifier

  GrindFlow\Ops\Http\StaffOpsController:
    tags: ['controller.service_arguments']

  GrindFlow\Ops\Security\StaffOpsConfiguration:
    arguments:
      $keysJson: '%env(default:grindflow_ops_keys_json_default:GRINDFLOW_OPS_KEYS_JSON)%'
      $allowlist: '%env(default:grindflow_ops_allowlist_default:GRINDFLOW_OPS_ALLOWLIST)%'

  GrindFlow\Ops\Security\StaffOpsRequestAuthenticator:
    arguments:
      $rateLimit: '%env(int:default:grindflow_ops_rate_limit_default:GRINDFLOW_OPS_RATE_LIMIT)%'

  GrindFlow\Ops\Routing\StaffOpsRouteLoader:
    tags: ['routing.loader']
