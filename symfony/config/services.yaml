parameters:
  grindflow_vault_root_default: ''

services:
  _defaults:
    autowire: true
    autoconfigure: true

  GrindFlow\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'

  GrindFlow\Shared\Version\ProductVersion:
    arguments:
      $repositoryDir: '%kernel.project_dir%/..'

  GrindFlow\Http\AssetManifest:
    arguments:
      $projectDir: '%kernel.project_dir%'

  GrindFlow\Infrastructure\Storage\PrivateVaultDirectory:
    arguments:
      $projectDir: '%kernel.project_dir%'
      $rootOverride: '%env(default:grindflow_vault_root_default:GRINDFLOW_VAULT_ROOT)%'

  GrindFlow\Infrastructure\Storage\VaultStageCommand:
    arguments:
      $projectDir: '%kernel.project_dir%'

  GrindFlow\Infrastructure\Storage\VaultVerifyStageCommand:
    arguments:
      $projectDir: '%kernel.project_dir%'
